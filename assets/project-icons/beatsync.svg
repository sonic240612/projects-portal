<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="beatsync-title">
  <title id="beatsync-title">BeatSync — real-time music quiz &amp; timeline cards</title>
  <defs>
    <linearGradient id="beat-bg" x1="16" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#6339d9"/>
      <stop offset="1" stop-color="#3b1d9c"/>
    </linearGradient>
    <linearGradient id="beat-rim" x1="64" y1="2" x2="64" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="beat-glass" x1="38" y1="36" x2="90" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="beat-bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="beat-bar-main" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="beat-phones" x1="30" y1="34" x2="98" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#e0e7ff" stop-opacity=".8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="124" height="124" rx="29" fill="url(#beat-bg)"/>

  <!-- Subtle vinyl groove ring / sound wave ripple -->
  <circle cx="64" cy="65" r="42" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity=".35" stroke-dasharray="3 3"/>
  <circle cx="64" cy="65" r="33" fill="url(#beat-glass)" stroke="#ffffff" stroke-width="1" stroke-opacity=".25"/>

  <!-- Headphones arch -->
  <path d="M34 68 A30 30 0 0 1 94 68" fill="none" stroke="url(#beat-phones)" stroke-width="6" stroke-linecap="round"/>
  <!-- Headphone earcups with shadow -->
  <rect x="25" y="60" width="12" height="23" rx="6" fill="#241169" opacity=".35" transform="translate(0 2)"/>
  <rect x="25" y="60" width="12" height="23" rx="6" fill="url(#beat-phones)"/>
  <rect x="28" y="64" width="6" height="15" rx="3" fill="#818cf8"/>

  <rect x="91" y="60" width="12" height="23" rx="6" fill="#241169" opacity=".35" transform="translate(0 2)"/>
  <rect x="91" y="60" width="12" height="23" rx="6" fill="url(#beat-phones)"/>
  <rect x="94" y="64" width="6" height="15" rx="3" fill="#818cf8"/>

  <!-- Equalizer soundwave bars -->
  <!-- Bar 1 -->
  <rect x="44" y="58" width="5.5" height="18" rx="2.75" fill="url(#beat-bar)"/>
  <!-- Bar 2 -->
  <rect x="52.5" y="49" width="5.5" height="34" rx="2.75" fill="url(#beat-bar-main)"/>
  <!-- Bar 3 (Center - Highest peak) -->
  <rect x="61" y="42" width="6" height="46" rx="3" fill="#ffffff"/>
  <!-- Bar 4 -->
  <rect x="70" y="51" width="5.5" height="30" rx="2.75" fill="url(#beat-bar-main)"/>
  <!-- Bar 5 -->
  <rect x="78.5" y="60" width="5.5" height="15" rx="2.75" fill="url(#beat-bar)"/>

  <!-- Glowing sync audio wave line -->
  <path d="M40 78 Q 48 83, 56 69 T 72 65 T 88 77" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- Sparkle rhythm star -->
  <path d="m97 25 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5Z" fill="#fef08a"/>
  <circle cx="33" cy="31" r="3" fill="#38bdf8" opacity=".85"/>

  <!-- Rim Highlight -->
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="28.25" fill="none" stroke="url(#beat-rim)" stroke-width="1.5"/>
</svg>
